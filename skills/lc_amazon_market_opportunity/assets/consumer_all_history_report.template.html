<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="all-history-report-template-version" content="1.0.0">
  <meta name="analysis-sha256" content="{{ANALYSIS_SHA256}}">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'none'; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; form-action 'none'; base-uri 'none'">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --ink: #17212b;
      --ink-strong: #101820;
      --muted: #687583;
      --muted-strong: #435160;
      --line: #d9e1e7;
      --line-strong: #b9c5cf;
      --page: #f2f5f7;
      --panel: #ffffff;
      --soft: #f5f7f8;
      --blue: #1d67a8;
      --blue-soft: #eaf3fa;
      --orange: #d88708;
      --orange-soft: #fff5df;
      --green: #24745b;
      --green-soft: #eaf6f1;
      --red: #b94a42;
      --red-soft: #fff0ee;
      --violet: #6554a3;
      --violet-soft: #f1eff9;
      --cockpit: #17212b;
      --shadow: 0 8px 22px rgba(23, 33, 43, .05);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.68;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4 {
      color: var(--ink-strong);
      font-family: Bahnschrift, "DIN Alternate", "Arial Narrow", "PingFang SC", sans-serif;
      line-height: 1.28;
      overflow-wrap: break-word;
    }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 3.2vw, 42px); letter-spacing: -.035em; }
    h2 { margin: 0; font-size: clamp(22px, 2.2vw, 30px); letter-spacing: -.02em; }
    h3 { margin: 0 0 10px; font-size: 17px; }
    h4 { margin: 0 0 7px; font-size: 14px; }
    p { margin: 0 0 11px; }
    ul, ol { margin: 7px 0 11px; padding-left: 21px; }
    li + li { margin-top: 4px; }
    img { max-width: 100%; }
    small, .muted { color: var(--muted); }
    .num { font-variant-numeric: tabular-nums; }

    .skip-link {
      position: fixed;
      z-index: 100;
      top: 8px;
      left: 8px;
      padding: 8px 12px;
      color: #fff;
      background: var(--blue);
      border-radius: 4px;
      transform: translateY(-150%);
    }
    .skip-link:focus { transform: translateY(0); }
    a:focus-visible, summary:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }

    .report-shell {
      width: min(1420px, 100%);
      margin: 0 auto;
      padding: 30px 22px 52px;
      display: grid;
      grid-template-columns: 206px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }
    .report-content { min-width: 0; }
    .sidebar {
      position: sticky;
      top: 18px;
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-top: 4px solid var(--cockpit);
      border-radius: 5px;
    }
    .sidebar-title { margin: 0 0 9px; font-size: 14px; font-weight: 800; }
    .sidebar a {
      display: block;
      padding: 9px 10px;
      color: #334155;
      border-radius: 3px;
      font-size: 13px;
      line-height: 1.35;
      text-decoration: none;
    }
    .sidebar a:hover { color: var(--blue); background: var(--blue-soft); }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 30px;
      color: #dbe4eb;
      background: var(--cockpit);
      border: 1px solid var(--cockpit);
      border-radius: 5px;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0 8% 0 auto;
      width: 74px;
      opacity: .14;
      background: repeating-linear-gradient(90deg, transparent 0 16px, #fff 16px 20px);
      transform: skewX(-16deg);
      pointer-events: none;
    }
    .hero h1 { max-width: 920px; color: #fff; }
    .eyebrow { margin-bottom: 7px; color: var(--orange); font-size: 12px; font-weight: 800; letter-spacing: .08em; }
    .generated-at { margin: 0; color: #aebbc6; font-size: 13px; }
    .hero-rule { display: flex; flex-wrap: wrap; gap: 7px 18px; margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.16); color: #c5d0d9; font-size: 12px; }
    .hero-rule span { display: inline-flex; align-items: center; gap: 7px; }
    .hero-rule i { width: 8px; height: 8px; border-radius: 50%; background: #5ca2d5; }
    .hero-rule span:nth-child(2) i { background: var(--orange); }
    .hero-rule span:nth-child(3) i { background: var(--green); }

    .panel, .card, .metric, .concept-card, details {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 5px;
      box-shadow: var(--shadow);
    }
    .report-section { margin-top: 18px; padding: clamp(18px, 2.5vw, 30px); scroll-margin-top: 20px; }
    .section-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; margin-bottom: 15px; }
    .section-head p { max-width: 720px; margin: 0; color: var(--muted); font-size: 13px; text-align: right; }
    .section-kicker { margin: 0 0 4px !important; color: var(--blue) !important; font-size: 12px !important; font-weight: 800; letter-spacing: .04em; }
    .section-lead { max-width: 900px; color: var(--muted-strong); }
    .subsection { margin-top: 20px; }

    .metric-grid, .semantic-grid, .two-col, .three-col, .concept-grid, .moscow-grid, .process-grid {
      display: grid;
      gap: 11px;
      margin: 15px 0;
    }
    .metric-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .semantic-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .two-col { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .three-col, .concept-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .moscow-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .process-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .metric { padding: 14px; box-shadow: none; }
    .metric span { display: block; color: var(--muted); font-size: 12px; }
    .metric b { display: block; margin-top: 5px; color: var(--ink-strong); font-size: 23px; line-height: 1.2; overflow-wrap: anywhere; }
    .metric small { display: block; margin-top: 5px; line-height: 1.4; }
    .card { padding: 18px; }

    .decision-summary {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(280px, .55fr);
      gap: 16px;
      margin-top: 18px;
      padding: clamp(20px, 3vw, 34px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 5px solid var(--orange);
      border-radius: 5px;
      box-shadow: var(--shadow);
    }
    .decision-copy h2 { margin: 4px 0 12px; max-width: 820px; font-size: clamp(25px, 3vw, 38px); }
    .decision-copy > p:last-child { margin-bottom: 0; color: var(--muted-strong); }
    .decision-facts { padding: 18px; color: #d8e1e8; background: var(--cockpit); border-radius: 4px; }
    .decision-facts > span { display: block; color: #9fb0bd; font-size: 12px; }
    .decision-facts > strong { display: block; margin: 4px 0 8px; color: #fff; font: 800 34px/1 Bahnschrift, "DIN Alternate", sans-serif; }
    .decision-facts ul { margin: 12px 0 0; padding: 12px 0 0; border-top: 1px solid rgba(255,255,255,.14); list-style: none; }
    .decision-facts li { display: flex; justify-content: space-between; gap: 12px; margin: 0; padding: 3px 0; color: #cbd5dc; }
    .decision-facts li b { color: #fff; font-weight: 750; }

    .callout, .warning, .method-note, .success-note { margin: 14px 0; padding: 12px 14px; border: 1px solid; border-radius: 6px; }
    .callout, .method-note { color: #1e3a8a; background: var(--blue-soft); border-color: #bfdbfe; }
    .warning { color: #8a4b12; background: var(--orange-soft); border-color: #fed7aa; }
    .success-note { color: var(--green); background: var(--green-soft); border-color: #bbf7d0; }

    .funnel { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin: 14px 0; }
    .funnel-step { position: relative; min-width: 0; padding: 13px; background: var(--soft); border-top: 3px solid var(--line-strong); }
    .funnel-step + .funnel-step::before { content: "→"; position: absolute; top: 26px; left: -8px; z-index: 1; color: var(--line-strong); font-weight: 900; }
    .funnel-step:last-child { border-top-color: var(--green); background: var(--green-soft); }
    .funnel-step span { display: block; color: var(--muted); font-size: 11px; }
    .funnel-step strong { display: block; margin-top: 5px; font-size: 19px; font-variant-numeric: tabular-nums; }

    .semantic-card { padding: 17px; background: #fff; border: 1px solid var(--line); border-top: 4px solid var(--blue); }
    .semantic-card:nth-child(2), .semantic-card:nth-child(5) { border-top-color: var(--red); }
    .semantic-card:nth-child(3), .semantic-card:nth-child(6) { border-top-color: var(--green); }
    .semantic-card > span { color: var(--muted); font-size: 11px; }
    .semantic-card h3 { margin: 5px 0 4px; }
    .semantic-number { color: var(--ink-strong); font-size: 25px; font-weight: 800; }
    .semantic-number small { margin-left: 6px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .topic-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .chip, .tag, .priority-tag { display: inline-flex; align-items: center; padding: 4px 8px; border: 1px solid #cbd5e1; border-radius: 999px; color: #334155; background: #f8fafc; font-size: 11px; font-weight: 700; }

    .insight-list { border-top: 1px solid var(--line); }
    .insight-row { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 2px; border-bottom: 1px solid var(--line); }
    .insight-rank { color: var(--line-strong); font: 800 20px/1 Bahnschrift, "DIN Alternate", sans-serif; }
    .insight-content h4 { margin: 0 0 6px; }
    .insight-bar { width: min(100%, 520px); height: 5px; overflow: hidden; background: #e8edf1; }
    .insight-bar span { display: block; width: var(--value, 0%); height: 100%; background: var(--blue); }
    .insight-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 5px; color: var(--muted); font-size: 11px; }
    .insight-meta strong { color: var(--ink); }
    .insight-side { min-width: 74px; color: var(--muted-strong); font-size: 11px; text-align: right; }

    .segment-card { margin-top: 14px; padding: 22px; background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--blue); }
    .segment-card > header, .concept-header { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
    .segment-card header p { margin: 3px 0 0; color: var(--muted); }
    .segment-badge { flex: 0 0 auto; padding: 5px 9px; color: #8b5700; background: var(--orange-soft); border: 1px solid #edcf91; font-size: 11px; font-weight: 800; }
    .segment-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; margin: 14px 0; background: var(--line); border: 1px solid var(--line); }
    .segment-metrics > div { padding: 11px; background: #fff; }
    .segment-metrics span { display: block; color: var(--muted); font-size: 11px; }
    .segment-metrics strong { display: block; margin-top: 4px; }

    .kano-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
    .kano-item { padding: 14px; background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--blue); }
    .kano-item.must { border-left-color: var(--red); }
    .kano-item.attractive { border-left-color: var(--green); }
    .kano-item.reverse { border-left-color: var(--orange); }
    .kano-item.indifferent { border-left-color: #64748b; }
    .kano-item.pending { border-left-color: var(--violet); }
    .kano-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .kano-label { flex: 0 0 auto; padding: 4px 8px; border: 1px solid var(--line); color: var(--blue); background: var(--blue-soft); font-size: 11px; font-weight: 800; }
    .kano-item.must .kano-label { color: var(--red); background: var(--red-soft); }
    .kano-item.attractive .kano-label { color: var(--green); background: var(--green-soft); }
    .kano-item.reverse .kano-label { color: #9a5904; background: var(--orange-soft); }
    .kano-item.pending .kano-label { color: var(--violet); background: var(--violet-soft); }
    .kano-item p { margin: 8px 0 0; color: var(--muted-strong); font-size: 12px; }

    .innovation-list { display: grid; gap: 9px; }
    .innovation-item { padding: 15px; background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--orange); }
    .innovation-item header { display: flex; justify-content: space-between; gap: 12px; }
    .innovation-item header span { color: var(--muted); font-size: 11px; }
    .innovation-item dl { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 5px 10px; margin: 10px 0 0; }
    .innovation-item dt { color: var(--muted); font-size: 11px; font-weight: 700; }
    .innovation-item dd { margin: 0; }

    .concept-card { margin-top: 18px; padding: clamp(18px, 2.5vw, 28px); border-top: 5px solid var(--cockpit); }
    .concept-card:first-of-type { border-top-color: var(--orange); }
    .concept-header { margin-bottom: 14px; }
    .concept-header h3 { margin: 3px 0 0; font-size: clamp(21px, 2vw, 27px); }
    .concept-hero { display: grid; grid-template-columns: minmax(300px, .95fr) minmax(0, 1.05fr); gap: 18px; }
    .concept-figure { margin: 0; overflow: hidden; background: #edf1f6; border: 1px solid var(--line); border-radius: 5px; }
    .concept-figure img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
    .concept-figure figcaption { padding: 8px 10px; color: var(--muted); background: #fff; font-size: 11px; }
    .concept-brief { padding: 18px; background: var(--soft); }
    .jtbd { font-size: 15px; }
    .facts { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 7px 12px; margin: 14px 0 0; }
    .facts dt { color: var(--muted); font-size: 11px; font-weight: 700; }
    .facts dd { margin: 0; }
    .spec-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
    .spec-grid > article { padding: 15px; background: var(--soft); border-top: 3px solid var(--line-strong); }
    .moscow-card { padding: 14px; background: #fff; border: 1px solid var(--line); border-top: 3px solid var(--blue); }
    .moscow-card.must { border-top-color: var(--red); }
    .moscow-card.could { border-top-color: var(--green); }
    .moscow-card.wont { border-top-color: #64748b; }
    .priority-tag.must { color: var(--red); background: var(--red-soft); border-color: #fecdca; }
    .priority-tag.should { color: var(--blue); background: var(--blue-soft); border-color: #bfdbfe; }
    .priority-tag.could { color: var(--green); background: var(--green-soft); border-color: #bbf7d0; }
    .priority-tag.wont { color: #475569; background: #f8fafc; border-color: #e2e8f0; }
    .process-step { position: relative; padding: 34px 12px 12px; background: var(--soft); }
    .process-step > span { position: absolute; top: 10px; left: 10px; display: grid; width: 20px; height: 20px; place-items: center; color: #fff; background: var(--cockpit); border-radius: 50%; font-size: 10px; }
    .prompt-box { margin-top: 10px; padding: 10px 11px; color: #344054; background: #f8fafc; border: 1px solid #e2e8f0; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }

    .table-frame { width: 100%; margin: 12px 0 18px; overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 9px 10px; border-bottom: 1px solid #eef0f4; font-size: 12px; text-align: left; vertical-align: top; }
    th { color: var(--muted-strong); background: #f1f5f9; font-weight: 750; white-space: nowrap; }
    tbody tr:last-child td { border-bottom: 0; }
    td.number, th.number { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

    .voice-list { display: grid; gap: 9px; margin-top: 12px; }
    .voice-item { padding: 12px; background: #fff; border: 1px solid var(--line); border-left: 3px solid #94a3b8; }
    .voice-item blockquote { margin: 0 0 7px; padding-left: 12px; color: #344054; border-left: 3px solid var(--line-strong); }
    .voice-item p { margin-bottom: 0; font-size: 12px; }
    .voice-meta { color: var(--muted); font-size: 11px; }
    details { margin: 12px 0; padding: 13px 14px; box-shadow: none; }
    summary { cursor: pointer; color: var(--ink-strong); font-weight: 750; }
    details[open] summary { margin-bottom: 12px; }
    .empty-state { padding: 24px 16px; color: var(--muted); background: #f8fafc; border: 1px dashed #cbd5e1; text-align: center; }
    .footer-note { margin-top: 30px; padding-top: 16px; color: var(--muted); border-top: 1px solid var(--line); font-size: 12px; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
    @media (max-width: 1180px) {
      .metric-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .semantic-grid, .three-col, .concept-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .moscow-grid, .segment-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .concept-hero { grid-template-columns: 1fr; }
    }
    @media (max-width: 980px) {
      .report-shell { display: block; padding: 18px 14px 42px; }
      .sidebar { position: static; display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; }
      .sidebar-title { display: none; }
      .sidebar a { flex: 0 0 auto; white-space: nowrap; }
      .section-head { display: block; }
      .section-head p { margin-top: 5px; text-align: left; }
      .decision-summary { grid-template-columns: 1fr; }
      .funnel { grid-template-columns: repeat(2, minmax(0, 1fr)); overflow: visible; }
      .funnel-step + .funnel-step::before { content: none; }
    }
    @media (max-width: 680px) {
      body { font-size: 13px; }
      .report-shell { padding-inline: 10px; }
      .hero { padding: 17px; }
      h1 { font-size: 24px; }
      .metric-grid, .semantic-grid, .two-col, .three-col, .concept-grid, .moscow-grid, .process-grid, .kano-grid, .spec-grid, .segment-metrics { grid-template-columns: 1fr; }
      .funnel { grid-template-columns: 1fr; }
      .insight-row { grid-template-columns: 30px minmax(0, 1fr); align-items: start; }
      .insight-side { grid-column: 2; text-align: left; }
      .concept-brief { padding: 14px; }
      .facts, .innovation-item dl { grid-template-columns: 1fr; }
      .table-frame { overflow-x: auto; }
      table { min-width: 680px; }
    }
    @media print {
      @page { size: A4; margin: 14mm; }
      html { scroll-behavior: auto; }
      body { color: #000; background: #fff; font-size: 10pt; }
      .skip-link, .sidebar { display: none !important; }
      .report-shell { display: block; width: auto; max-width: none; margin: 0; padding: 0; }
      .hero, .panel, .card, .metric, .concept-card, details { box-shadow: none; }
      .hero { border-color: #cbd5e1; }
      h2, h3, h4, thead { break-after: avoid; }
      tr, img, blockquote, .metric, .semantic-card, .kano-item, .voice-item { break-inside: avoid; }
      .metric-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .semantic-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .moscow-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .table-frame { overflow: visible; }
      table { min-width: 0; }
      details { display: block; }
      details > summary { list-style: none; }
      details > summary::-webkit-details-marker { display: none; }
      details:not([open]) > *:not(summary) { display: block !important; }
      details:not([open])::details-content { display: block !important; content-visibility: visible !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#report-content">跳至报告正文</a>
  <main class="report-shell">
    <nav class="sidebar" aria-label="报告导航">
      <div class="sidebar-title">报告导航</div>
      <a href="#decision">核心结论</a>
      <a href="#funnel">全量清洗</a>
      <a href="#semantics">六类消费者表达</a>
      <a href="#category">需求与口碑</a>
      <a href="#segments">Top3细分</a>
      <a href="#kano">需求属性</a>
      <a href="#innovation">新需求</a>
      <a href="#concepts">产品开发</a>
      <a href="#validation">验证路线</a>
      <a href="#voices">消费者原声</a>
      <a href="#method">方法与限制</a>
    </nav>
    <div class="report-content" id="report-content">
      <header class="hero" id="overview">
        <div class="eyebrow">AMAZON {{MARKETPLACE}} · 全历史本地消费者声音</div>
        <h1>{{TITLE}}</h1>
        <p class="generated-at">生成时间：{{GENERATED_AT}}</p>
        <div class="hero-rule" aria-label="报告核心口径">
