interface:
  display_name: "易逊-亚马逊套图生成 V8.1"
  short_description: "Agent 选模板或自行策划，生图模型一次画出产品、场景和文案，直接交付；参考图只借色调光线，模特每套新选且整套同一人，绝不照抄；主图保证 255 纯白底。"
  default_prompt: "Use $lc-amazon-image-studio together with the system-default $imagegen skill for Codex built-in image generation. Read the imagegen SKILL.md once per session; open its prompting references only when designing a custom layout or a correction. Follow its built-in workflow using the current host's actual interface, without requiring a fixed tool or JavaScript method name or automatically switching to CLI/API. Follow the V8.1 one-shot flow in SKILL.md: authenticate once per production task, verify the runtime (cached), init with the product photos and register any other reference images with --refs (never as product photos), analyse the references and borrow only colour tone and light (tone_ref) where they genuinely suit the design, pick one family and a template per slot (or custom) and write plan.json once with verified product facts, original scenes, short copy and, when a person appears, a newly cast model (cast) clearly unlike anyone in the references, run plan (it validates copy, builds a photo main image locally and returns the first wave), make one built-in image call per reservation with the prompt and exactly the listed references (never add other images) and its size when the tool takes one, glance at each result and pass --redo only for garbled or misspelled text, a wrong product or cut-off content (--recast if the set's model resembles a reference or a real person), ingest each wave in one ingest-batch call, then deliver and reply with the final image files only. The main image is made pure white (255) by the tool; never add shadows. Never copy people, scenes, products, brands or text from reference images."
