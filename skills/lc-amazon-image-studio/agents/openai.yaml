interface:
  display_name: "易逊-亚马逊套图生成 V8"
  short_description: "完整提示词策划、模型一次成图、附图直接交付；主图自动铺纯白，兼容历史项目与用户模板。"
  default_prompt: "Use $lc-amazon-image-studio with the system-default $imagegen skill and the host's actual built-in image generation interface. Read imagegen once per session. For new projects use scripts/lc_image_studio.py and workflow_policy one_pass_v1: authenticate once, verify Python/Pillow, plan verified product facts, all copy and complete visual designs, pin user templates, compile one complete prompt per slot, reserve by host capacity, generate finished images and ingest-batch. Secondary and A+ images go straight to delivery without OCR, visual review, mobile preview or automatic quality repair. Only main images require background-separation observation, transparent foreground over RGB(255,255,255), lossless PNG and final-file background verification; allow at most one background-specific repair. Preserve approved copy and fact evidence, never copy reference products or brands. Deliver sorted image file links and disclose missing slots. Route historical projects to the unchanged legacy pipeline; do not migrate them automatically or use the old JS adapter for new projects."
