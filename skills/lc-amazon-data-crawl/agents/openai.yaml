interface:
  display_name: "易逊-亚马逊数据采集"
  short_description: "采集 Amazon 关键词搜索、类目榜单、店铺和图片相似竞品数据，并可结合卖家精灵字段与筛选条件导出。"
  default_prompt: "Use $lc-amazon-data-crawl to crawl Amazon search results, storefronts, category ranks, or image competitors. Pass the cloud auth gate first via scripts/check_auth.sh (check_auth.ps1 on Windows) from its absolute installed path; never run tools/bin/lc-auth-check-* directly; if auth fails, stop. Never ask the user to sign in to an Amazon buyer account. Use a new job_id per task, dry-run before the real run, start real runs in the background with a log file, supervise via outputs/<job_id>/run_heartbeat.json, and after exit follow status/next_action in run_summary.json (exit codes 0/10/20/21/30/40/50 are explained in SKILL.md). Never start a second crawl while one runs and never ask for API keys in chat."
