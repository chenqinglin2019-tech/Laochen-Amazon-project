version: '2.2'
domain: title
contract_ref: ../data_contract.md
policy_ref: ../quality_policy.json
sources_ref: ../sources.json
rules:
- id: title_identity_first
  type: required
  source_id: user_product_identity
  prompt_fragment: 标题必须完整保留 product_identity.protected_terms，即使核心名称没有出现在关键词来源（扩词结果或用户表格）中、或流量未知，也不得降级、拆散或换成后台类目枚举。配件必须保留配件身份，不能写成主机或套装。
- id: title_budget
  type: required
  source_id: amazon_title_2026
  prompt_fragment: 非媒介类标题 ≤75 字符（含空格），2026-07-27 起超长标题会被 Amazon 逐步替换为 AI 推荐版本。先给完整品名、必要规格和子体识别值留出空间，超长时移走次要卖点，不截断品名、单位或变体值。
  limit_ref: default_limits.title_max_chars
- id: title_compliance
  type: required
  source_id: amazon_title_rules_2025
  prompt_fragment: 不使用 ! $ ? _ { } ^ ¬ ¦（品牌名自带的除外，机器检查为 error）；同一个词最多出现 2 次，介词、冠词、连词除外（warning）；不写促销语、价格或主观夸赞。
- id: title_keyword_coverage
  type: editorial
  source_id: amazon_search_terms_2026
  prompt_fragment: 在自然语序前提下尽量用到 60–75 字符：品牌（已知时）+ 完整品名 + 最重要的差异或规格，把高流量 eligible 词的核心词放进标题。同义品名不堆叠；其他有效词放入 Highlight、五点或后台词。写完脱离词表重读，确认一眼能看懂卖的是什么。
- id: title_localization
  type: required
  source_id: user_unit_localization
  prompt_fragment: 遵循目标语言的大小写、标点和语序；英语用自然 Title Case。尺寸使用规范化后的 display_text，并保持维度对应。型号和真实品牌保持原样。
- id: title_family
  type: required
  source_id: user_family_rules
  prompt_fragment: family 模式遵循 variation_rules.yaml：父标题只写系列共性；子标题由同一个 title_template 按输入顺序生成，按最长属性组合统一压缩共同部分。
- id: title_verified_claims
  type: required
  source_id: skill_editorial_v2
  prompt_fragment: 只写有来源的本品事实，不写未经证实的兼容性、健康效果或第三方品牌。场景词只在有助于识别和购买判断时使用。
