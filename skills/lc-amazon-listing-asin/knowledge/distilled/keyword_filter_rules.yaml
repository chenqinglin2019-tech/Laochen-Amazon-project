version: '1.2'
domain: keyword_filter
contract_ref: ../data_contract.md
sources_ref: ../sources.json
rules:
- id: unified_keyword_ledger
  type: required
  source_id: user_keyword_audit_v11
  prompt_fragment: 三类词池只通过 keyword_quality.py prepare/apply/check/export 建立和导出。03_keyword_decisions 的逐词记录是唯一分类依据；调整分类时保留 initial_decision 并写 resolution。模型负责完整语义判断，程序负责覆盖、边界、引用和隔离。禁止用临时白名单或子串正则删词，不做剔除词第二轮复核。
- id: intent_group_judgement
  type: required
  source_id: user_keyword_audit_v12
  prompt_fragment: 读 03_keyword_view.tsv（按搜索量排序）。完整搜索意图相同的词归为一组，每组写一次判断，再由 apply 复制到每个成员；组内个别词判断不同时用 overrides 并写 group_difference。按意图归组，不能按片段或排序后的词袋归组。逐词账本和全部 check 规则不变。
- id: complete_intent_before_decision
  type: required
  source_id: user_keyword_audit_v11
  prompt_fragment: 先识别完整搜索对象和修饰关系，再与本品比较。door、sign、cat door 只是线索；要区分本体、图案、配件和适用对象；bathroom 不是 bat，lightweight 不是 light。
- id: three_pools
  type: required
  source_id: user_keyword_audit_v11
  prompt_fragment: eligible 是有依据的可用候选；deferred 是有歧义或事实未知的暂缓词，须写晋级条件，不得进入正文、后台、图片文案或 QA 请求；excluded 要写具体剔除理由。没有流量不是无关的证据。竞品品牌词和第三方商标词即使意图相关，也不进入本品文案和后台（按 product_mismatch 剔除并在理由中写明是品牌词）。
- id: unknown_not_conflicting
  type: required
  source_id: user_keyword_audit_v11
  prompt_fragment: 只确认 metal 不等于确认 iron；未提供户外用途不等于已证实不适合户外。未知或部分匹配进入 deferred，只有明确反证才能按事实冲突剔除。暂缓词的晋级条件会汇总为"补充事实可解锁的流量"。
- id: lexical_normalization_boundary
  type: required
  source_id: user_keyword_audit_v11
  prompt_fragment: 保留原词和原始位置，只做 NFKC、大小写、空白和标点形式的规范化，不删否定词、数字、单位或词序。保留重音、中文、日文等有效文字。核心品名在原词中缺席时由工具补登，无流量时保持未知。
- id: scope_and_placement
  type: required
  source_id: user_keyword_audit_v11
  prompt_fragment: 相关性与投放字段相互独立，不适合标题不等于无关。子体专属词只用于对应子体，共用正文和父体不能吸收专属属性。后台词不是暂缓词的收容处。
- id: honest_acceptance
  type: required
  source_id: user_keyword_audit_v11
  prompt_fragment: 完成条件包括数量守恒、分类完整、导出一致，以及最终文案与关键词一致性复审。不设保留率配额。画像在筛词后改动时用 rebind 只复核受影响的词，指纹失效不能标通过。
