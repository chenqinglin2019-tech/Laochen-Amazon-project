version: '2.2'
domain: media
contract_ref: ../data_contract.md
policy_ref: ../quality_policy.json
sources_ref: ../sources.json
rules:
- id: media_contract
  type: required
  source_id: user_delivery_media_v21
  prompt_fragment: image_plan 和 a_plus_plan 每项按 data_contract 保存：唯一 plan_id、image 或 module、中文 direction、role、applies_to、买家问题、卖点、画面证据、场景/意图、overlay_text、引用、body_refs、mobile_check、production_notes。A+ 原生文字放 native_text；新输出统一用 a_plus_plan。
- id: media_sets
  type: required
  source_id: user_delivery_media_v21
  prompt_fragment: 单品和系列共用方案都是 1 主图 + 6 附图 + 至少 5 张 A+ 图片（纯文字模块不计入）。系列按输入顺序再出逐子体方案：外观不同或未确认用 per_variant_full（每子体独立 1+6）；有来源确认外观相同且只差尺寸或数量时用 shared_secondary（每子体只独立主图，附图引用共用创意并用 variant_bindings 绑定参数和素材）。A+ 只放在 shared。所有创意都要归组。
- id: media_numbering
  type: required
  source_id: user_delivery_media_v21
  prompt_fragment: 每套主附图按"图1（主图）"到"图7（主题）"编号；A+ 按"模块N：主题"编号，并写明 asset_type=image/text；plan_id 全局唯一。
- id: media_slot_map
  type: editorial
  source_id: amazon_product_photos
  prompt_fragment: 每张图回答一个主要购买问题，6 张附图默认按购买问题和 intent_map 分配，可按品类调整：场景/地点、人群/使用方式、尺寸/适配（尺寸图带维度标签）、包装清单、材质/细节、差异或对比。不重复同一句卖点凑数。A+ 依次讲品牌或系列价值、使用场景、细节证据、规格或选购对比、FAQ（文字模块可回答高频问题）。
- id: media_main
  type: required
  source_id: amazon_product_photos
  prompt_fragment: 主图为纯白背景（RGB 255），产品占画面 85% 以上，最长边建议 1600px 以上；overlay_text 和 native_text 都为空，不加 logo、水印或促销信息。准确展示该可售子体的实物、数量和随附配件，不把未随售的道具当配件，不把全系列画成一个购买套装。
- id: media_variant_scope
  type: required
  source_id: user_delivery_media_v21
  prompt_fragment: 共用模板 applies_to=all 的本体只引用根级共性和通用素材。参数或素材不同时，用 variant_bindings 按输入顺序覆盖全部子体，每个绑定只引用根级和本子体的事实与素材。
- id: media_material_availability
  type: required
  source_id: user_delivery_media_v21
  prompt_fragment: source_image_ids 只能引用实际提供且范围匹配的素材。缺素材时标 pending，production_notes 写清子体、角度或部件缺口，验收保持 incomplete，不减图也不编造。
- id: media_text_sync
  type: required
  source_id: user_unit_localization
  prompt_fragment: overlay_text 或 native_text 含参数时复用 measurements.display_text，并在 body_refs 对应正文中写出相同参数和 measurement_ids。重要信息必须同时出现在可索引的正文里：图片文字和 A+ 正文是否被检索，官方从未确认。
- id: media_language_mobile
  type: required
  source_id: user_image_planning
  prompt_fragment: 策划说明用中文；overlay_text 和 native_text 使用 listing_language。mobile_check 写具体的字级层次、文字量、主体比例和手机端检查点；成图不存在时记为制作验收要求。
- id: media_scene_truth
  type: required
  source_id: skill_editorial_v2
  prompt_fragment: 人物、环境、道具、安装方式、比例和适配对象都必须符合已确认事实，不为覆盖意图展示无法成立的安装、承重、兼容性或效果。最终渲染图不存在时只验收策划，不宣称已完成成图验收。
